<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio de Alex — Desarrollador multiplataforma en formación">
  <title>Alex · Portfolio</title>
  
  <!-- Fuentes Geist / Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Skip link para accesibilidad -->
  <a href="#main" class="skip-link">Saltar al contenido principal</a>
  
  <!-- Barra superior (56px alto según diseño) -->
  <header class="topbar">
    <div class="topbar__inner">
      <span class="topbar__identity" id="topbar-identity">Alex</span>
      <!-- Navegación se añadirá si el diseño la requiere -->
    </div>
  </header>

  <main id="main" class="main">
    <!-- Sección Perfil -->
    <section id="perfil" class="section section--perfil" aria-labelledby="perfil-title">
      <div class="container">
        <h2 id="perfil-title" class="visually-hidden">Perfil</h2>
        <!-- Contenido dinámico desde profile.json -->
        <div id="perfil-content" class="perfil__content">
          <!-- Placeholder para carga -->
          <p class="loading">Cargando perfil…</p>
        </div>
      </div>
    </section>

    <!-- Sección Proyectos -->
    <section id="proyectos" class="section section--proyectos" aria-labelledby="proyectos-title">
      <div class="container">
        <header class="section__header">
          <p class="section__antetitulo">Portfolio</p>
          <h2 id="proyectos-title" class="section__titulo">Proyectos</h2>
        </header>
        <!-- Contenido dinámico desde projects.json -->
        <div id="proyectos-content" class="proyectos__grid">
          <!-- Placeholder para carga -->
          <p class="loading">Cargando proyectos…</p>
        </div>
      </div>
    </section>

    <!-- Sección Contacto -->
    <section id="contacto" class="section section--contacto" aria-labelledby="contacto-title">
      <div class="container">
        <header class="section__header">
          <p class="section__antetitulo">Contacto</p>
          <h2 id="contacto-title" class="section__titulo">Hablemos</h2>
        </header>
        <!-- Contenido dinámico desde profile.json -->
        <div id="contacto-content" class="contacto__content">
          <!-- Placeholder para carga -->
          <p class="loading">Cargando contacto…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="footer__text">© 2026 Alex · Hecho con HTML, CSS y JavaScript</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
